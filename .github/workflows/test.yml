name: tests

# Runs the suites nobody was running. Both were green only when someone
# remembered to type `npm test`, which is how saim/backend sat red without
# anyone noticing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Pi's PM2 daemon (v22.22.2). better-sqlite3 is a native
          # module compiled against a specific Node ABI — testing on a different
          # major than production defeats the point of testing it at all.
          node-version: '22'

      # ⚠ NOT BACKEND ALONE. The render tests (`*-render.test.js`) draw real
      # components from frontend/ and saim/ and need React from those apps'
      # node_modules. Installing only backend/ failed 17 of them with "Cannot
      # find module 'react'" — so this job was red on every push for weeks while
      # the same suite passed on the Pi, where everything is installed.
      # Reproduced from a clean clone on 2 Oct 2026: 4,435 pass / 17 fail
      # backend-only, 4,610 / 0 with these three installs.
      - name: Install workspace deps (backend, frontend, worker)
        run: npm ci || npm install

      - name: Install SAiM app deps (render tests use them)
        run: |
          (cd saim/app && (npm ci || npm install))
          (cd saim/frontend && (npm ci || npm install))

      - name: Run backend tests
        working-directory: backend
        # MUST run from backend/. `node --test` with no path walks the whole
        # repo from the cwd, so running this at the root silently pulls in
        # saim/backend's suite too and the result depends on where you stood.
        run: npm test

  saim-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # SAiM's runtime is deliberately pinned to Node 20 on the Pi.
          node-version: '20'

      - name: Install SAiM deps
        working-directory: saim/backend
        run: npm ci || npm install

      - name: Run SAiM tests
        working-directory: saim/backend
        run: npm test
