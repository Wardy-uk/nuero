name: android-sensor

# Builds the SARA room sensor APK for the study tablet (sara/android-sensor).
# Built here rather than locally: the Windows box is ARM64, where the Android build
# tools are awkward, and nothing else in the estate needs an Android SDK installed.
#
# Every green build on main is published to ONE rolling pre-release,
# `android-sensor-latest`, so the tablet can download it straight from its browser:
#   https://github.com/Wardy-uk/nuero/releases/download/android-sensor-latest/sara-sensor.apk
# The APK carries no secrets — the Watch IRK is typed into the tablet, never built in.
on:
  push:
    branches: [main]
    paths:
      - 'sara/android-sensor/**'
      - '.github/workflows/android-sensor.yml'
  workflow_dispatch:

permissions:
  contents: write   # to update the rolling release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SARA_SENSOR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sara-sensor.p12"
            echo "SARA_SENSOR_KEYSTORE=$RUNNER_TEMP/sara-sensor.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SARA_SENSOR_KEYSTORE_B64 is not set - signing with a throwaway debug key. It will install, but every update needs an uninstall first (and loses the settings)."
          fi

      - name: Test and build
        working-directory: sara/android-sensor
        env:
          SARA_SENSOR_KEYSTORE_PASSWORD: ${{ secrets.SARA_SENSOR_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Name the APK
        run: cp sara/android-sensor/app/build/outputs/apk/release/app-release.apk sara-sensor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sara-sensor-apk
          path: sara-sensor.apk

      - name: Publish to the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-sensor-latest >/dev/null 2>&1 || \
            gh release create android-sensor-latest --prerelease \
              --title "SARA room sensor (latest)" \
              --notes "Rolling build of sara/android-sensor. Install on the study tablet; see sara/android-sensor/README.md."
          gh release upload android-sensor-latest sara-sensor.apk --clobber
